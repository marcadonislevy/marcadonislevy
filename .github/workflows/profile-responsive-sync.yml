name: Apply responsive profile implementation payload

on:
  push:
    branches:
      - profile-responsive-layout-20260831
    paths:
      - ".profile-sync/ready"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-responsive-sync
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out responsive profile branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: profile-responsive-layout-20260831
          fetch-depth: 0
          persist-credentials: true

      - name: Stop cleanly when no payload remains
        id: payload
        shell: bash
        run: |
          if [[ -f .profile-sync/ready ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Payload was already applied and removed."
          fi

      - name: Set up Node.js
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Validate and apply payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          manifest=".profile-sync/manifest.txt"
          archive="${RUNNER_TEMP}/profile-responsive-sync.tar.gz"
          encoded="${RUNNER_TEMP}/profile-responsive-sync.base64"
          test -s "${manifest}"
          expected="$(head -n 1 "${manifest}" | tr -d '[:space:]')"
          tail -n +2 "${manifest}" > .profile-sync/commit-message.txt
          cat \
            .profile-sync/payload.b64.000 \
            .profile-sync/payload.b64.001 \
            .profile-sync/payload.b64.002a \
            .profile-sync/payload.b64.002b \
            .profile-sync/payload.b64.002c \
            .profile-sync/payload.b64.002d \
            .profile-sync/payload.b64.003 \
            .profile-sync/payload.b64.004 \
            .profile-sync/payload.b64.005a \
            .profile-sync/payload.b64.005b \
            .profile-sync/payload.b64.005c \
            .profile-sync/payload.b64.005d \
            .profile-sync/payload.b64.006 \
            .profile-sync/payload.b64.007a \
            .profile-sync/payload.b64.007b \
            .profile-sync/payload.b64.007c \
            .profile-sync/payload.b64.007d \
            > "${encoded}"
          base64 --decode "${encoded}" > "${archive}"
          actual="$(sha256sum "${archive}" | cut -d' ' -f1)"
          if [[ ! "${expected}" =~ ^[0-9a-f]{64}$ || "${actual}" != "${expected}" ]]; then
            echo "::error::Implementation payload integrity check failed."
            exit 1
          fi
          python3 - "${archive}" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          with tarfile.open(archive, "r:gz") as bundle:
              for member in bundle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe payload member: {member.name}")
              bundle.extractall(".", filter="data")
          PY
          if [[ -f .profile-sync/delete-paths.txt ]]; then
            while IFS= read -r target; do
              [[ -z "${target}" ]] && continue
              [[ "${target}" == /* || "${target}" == *".."* ]] && {
                echo "::error::Unsafe delete path: ${target}"
                exit 1
              }
              rm -rf -- "${target}"
            done < .profile-sync/delete-paths.txt
          fi
          test -s .profile-sync/commit-message.txt

      - name: Run implementation tests
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm test
          git diff --check
          if [[ -f source/profile-source.sha256 ]]; then
            cat source/profile-source.b64.* | base64 --decode > "${RUNNER_TEMP}/profile-runtime.zip"
            actual="$(sha256sum "${RUNNER_TEMP}/profile-runtime.zip" | cut -d' ' -f1)"
            expected="$(tr -d '[:space:]' < source/profile-source.sha256)"
            test "${actual}" = "${expected}"
          fi

      - name: Commit applied implementation
        if: steps.payload.outputs.present == 'true'
        shell: bash
        env:
          BRANCH_NAME: profile-responsive-layout-20260831
        run: |
          set -euo pipefail
          message="$(cat .profile-sync/commit-message.txt)"
          rm -rf .profile-sync
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${message}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::Could not publish the implementation payload after three attempts."
              exit 1
            fi
            git fetch origin "${BRANCH_NAME}"
            git rebase "origin/${BRANCH_NAME}"
          done

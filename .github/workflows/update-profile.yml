name: Refresh profile activity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile.yml"
      - "README.template.md"
      - "config/profile.json"
      - "package.json"
      - "scripts/**"
      - "test/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current profile branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Validate required inputs
        shell: bash
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_OWNER_LOGINS: ${{ secrets.PROFILE_OWNER_LOGINS }}
        run: |
          set -euo pipefail
          test -n "${PROFILE_STATS_TOKEN}" || { echo "::error::PROFILE_STATS_TOKEN is not configured."; exit 1; }
          test -n "${PROFILE_OWNER_LOGINS}" || { echo "::error::PROFILE_OWNER_LOGINS is not configured."; exit 1; }

      - name: Run responsive renderer tests
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Generate six responsive profile assets
        shell: bash
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_OWNER_LOGINS: ${{ secrets.PROFILE_OWNER_LOGINS }}
        run: |
          set -euo pipefail
          node scripts/generate-profile.mjs --output "${GITHUB_WORKSPACE}"

      - name: Suppress timestamp-only changes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const { execFileSync } = await import("node:child_process");
          const { readFile, writeFile } = await import("node:fs/promises");
          let previousText;
          try {
            previousText = execFileSync("git", ["show", "HEAD:assets/stats.json"], { encoding: "utf8" });
          } catch {
            process.exit(0);
          }
          const previous = JSON.parse(previousText);
          const currentPath = "assets/stats.json";
          const current = JSON.parse(await readFile(currentPath, "utf8"));
          const comparable = (value) => {
            const clone = structuredClone(value);
            delete clone.generatedAt;
            return JSON.stringify(clone);
          };
          if (comparable(previous) === comparable(current)) {
            current.generatedAt = previous.generatedAt;
            await writeFile(currentPath, `${JSON.stringify(current, null, 2)}\n`, "utf8");
            console.log("No metric values changed; retained the prior snapshot timestamp.");
          }
          NODE

      - name: Verify generated public profile
        shell: bash
        env:
          PROFILE_DENYLIST: ${{ secrets.PROFILE_DENYLIST }}
        run: |
          set -euo pipefail
          node scripts/verify-public-output.mjs
          git diff --check
          test ! -e assets/profile-light.svg
          test ! -e assets/profile-dark.svg
          test ! -e source/profile-source.b64.00

      - name: Commit refreshed profile
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add README.md assets/profile-*-light.svg assets/profile-*-dark.svg assets/stats.json
          git add -u assets
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh responsive visual profile"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::Remote branch changed repeatedly; profile commit was not published."
              exit 1
            fi
            git fetch origin "${BRANCH_NAME}"
            if ! git rebase "origin/${BRANCH_NAME}"; then
              git rebase --abort || true
              echo "::error::Generated profile conflicts with newer work; refusing to overwrite it."
              exit 1
            fi
          done

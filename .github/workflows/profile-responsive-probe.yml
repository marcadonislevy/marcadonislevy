name: Verify responsive picture probe

on:
  push:
    branches:
      - profile-responsive-layout-20260831
    paths:
      - ".github/workflows/profile-responsive-probe.yml"
      - "docs/probes/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out responsive profile branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: profile-responsive-layout-20260831
          fetch-depth: 1
          persist-credentials: false

      - name: Render probe through GitHub Markdown API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jq -Rs '{text: ., mode: "gfm", context: "marcadonislevy/marcadonislevy"}' \
            docs/probes/responsive-picture.md > "${RUNNER_TEMP}/payload.json"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @"${RUNNER_TEMP}/payload.json" \
            https://api.github.com/markdown \
            > docs/probes/rendered-probe.html

      - name: Assert GitHub preserves responsive sources
        shell: bash
        run: |
          set -euo pipefail
          for media in \
            '(prefers-color-scheme: dark) and (max-width: 767px)' \
            '(prefers-color-scheme: light) and (max-width: 767px)' \
            '(prefers-color-scheme: dark) and (min-width: 768px) and (max-width: 1003px)' \
            '(prefers-color-scheme: light) and (min-width: 768px) and (max-width: 1003px)' \
            '(prefers-color-scheme: dark) and (min-width: 1004px)' \
            '(prefers-color-scheme: light) and (min-width: 1004px)'
          do
            grep -Fq "media=\"${media}\"" docs/probes/rendered-probe.html
          done
          for asset in \
            profile-probe-mobile-dark.svg \
            profile-probe-mobile-light.svg \
            profile-probe-compact-dark.svg \
            profile-probe-compact-light.svg \
            profile-probe-desktop-dark.svg \
            profile-probe-desktop-light.svg
          do
            grep -Fq "${asset}" docs/probes/rendered-probe.html
          done

      - name: Render viewport and theme screenshots
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "${browser}"
          output="${RUNNER_TEMP}/responsive-picture-probe"
          mkdir -p "${output}"
          cat > "${output}/index.html" <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><style>
          html,body{margin:0;padding:0;background:#0d1117;color:#f0f6fc;font-family:Arial,sans-serif}
          main{box-sizing:border-box;width:100%;padding:16px}
          img{display:block;max-width:100%;height:auto}
          </style></head><body><main>
          HTML
          cat docs/probes/rendered-probe.html >> "${output}/index.html"
          printf '</main></body></html>\n' >> "${output}/index.html"
          cp docs/probes/assets/*.svg "${output}/"
          sed -i 's#\./assets/#./#g' "${output}/index.html"

          for width in 375 430 768 1024 1440; do
            for theme in light dark; do
              flags=(--headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="${width},320")
              if [[ "${theme}" == dark ]]; then
                flags+=(--force-dark-mode)
              fi
              "${browser}" "${flags[@]}" \
                --screenshot="${output}/${width}-${theme}.png" \
                "file://${output}/index.html"
            done
          done

      - name: Upload probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: responsive-picture-probe
          path: |
            docs/probes/rendered-probe.html
            ${{ runner.temp }}/responsive-picture-probe/*.png
          if-no-files-found: error
          retention-days: 7

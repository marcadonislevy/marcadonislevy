name: Refresh Microsoft Learn profile

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/update-microsoft-learn.mjs"
      - ".github/scripts/run-microsoft-learn.mjs"
      - ".github/workflows/update-microsoft-learn.yml"
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: microsoft-learn-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false

      - name: Refresh Microsoft Learn metrics and assets
        env:
          MS_LEARN_PROFILE_URL: https://learn.microsoft.com/en-gb/users/marclevy/
        run: |
          set -euo pipefail
          node .github/scripts/run-microsoft-learn.mjs

      - name: Verify generated assets
        run: |
          set -euo pipefail
          node --check .github/scripts/update-microsoft-learn.mjs
          node --check .github/scripts/run-microsoft-learn.mjs
          git diff --check
          test -s assets/microsoft-learn-desktop.svg
          test -s assets/microsoft-learn-mobile.svg
          test -s assets/microsoft-learn.json

      - name: Commit Microsoft Learn refresh
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add assets/microsoft-learn-desktop.svg assets/microsoft-learn-mobile.svg assets/microsoft-learn.json
          if git diff --cached --quiet; then
            echo "Microsoft Learn metrics are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh Microsoft Learn progress"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::Remote branch changed repeatedly; Microsoft Learn refresh was not published."
              exit 1
            fi
            git fetch origin "${BRANCH_NAME}"
            if ! git rebase "origin/${BRANCH_NAME}"; then
              git rebase --abort || true
              echo "::error::Microsoft Learn refresh conflicts with newer work; refusing to overwrite it."
              exit 1
            fi
          done
